<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Acesse a plataforma oficial Feiticeira Club, Feiticeira VIP e Banca Feiticeira. Ambiente seguro e exclusivo para maiores de 18 anos.">
  
  <meta name="keywords" content="feiticeira club, feiticeira vip, banca feiticeira, feiticeira club oficial, feiticeira vip oficial, banca feiticeira club">
  
  <link rel="canonical" href="https://www.feiticeiraclub.com/">
  
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.feiticeiraclub.com/">
  <meta property="og:title" content="Feiticeira Club | Feiticeira VIP | Banca Feiticeira">
  <meta property="og:description" content="Acesse a plataforma oficial Feiticeira Club, Feiticeira VIP e Banca Feiticeira.">
  <meta property="og:image" content="https://www.feiticeiraclub.com/feiticeira.png">
  <meta property="og:locale" content="pt_BR">
  
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Feiticeira Club | Feiticeira VIP | Banca Feiticeira">
  <meta name="twitter:description" content="Acesse a plataforma oficial Feiticeira Club, Feiticeira VIP e Banca Feiticeira.">
  
  <link rel="icon" type="image/png" href="feiticeira.png">
  <link rel="apple-touch-icon" href="feiticeira.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .site-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
    }

    /* Banner de entrada */
    .banner-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
    }

    .banner {
      position: relative;
      width: min(900px, 95vw);
      max-height: 85vh;
      max-height: 85dvh;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
    }

    .banner-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 85vh;
      max-height: 85dvh;
      object-fit: contain;
    }

    .banner-link {
      position: absolute;
      inset: 0;
      z-index: 10001;
      cursor: pointer;
    }

    .banner-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 26px;
      line-height: 36px;
      cursor: pointer;
      z-index: 10002;
    }

    .banner-close:hover {
      background: #000;
    }

    /* WhatsApp box */
    .whatsapp-box {
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: 280px;
      padding: 22px 20px 20px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      cursor: pointer;
      font-family: Arial, sans-serif;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .whatsapp-box:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    .close-button {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: #777;
      font-size: 20px;
      line-height: 26px;
      cursor: pointer;
      z-index: 2;
    }

    .close-button:hover {
      color: #000;
    }

    .whatsapp-title {
      margin: 8px 0;
      color: #111;
      font-size: 18px;
      font-weight: 700;
    }

    .whatsapp-text {
      margin: 0;
      color: #555;
      font-size: 14px;
      line-height: 1.4;
    }

    .whatsapp-button {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 16px;
      background: #25D366;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .banner-overlay {
        padding: 10px;
      }

      .banner {
        width: 96vw;
        max-height: 75vh;
        max-height: 75dvh;
      }

      .banner-image {
        max-height: 75vh;
        max-height: 75dvh;
      }

      .whatsapp-box {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
      }
    }
  </style>
</head>

<body>

  <!-- Iframe em tela cheia sem restrições -->
  <iframe
    class="site-frame"
    src="https://app.feiticeira.club/pr/2iCVbLKr"
    title="Feiticeira Club - Plataforma Oficial"
    name="feiticeira-frame"
    allow="accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; gyroscope; payment; picture-in-picture; web-share"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <!-- Banner de entrada -->
  <div class="banner-overlay" id="bannerOverlay">
    <div class="banner">
      <img class="banner-image" src="aguianovo.png" alt="Feiticeira Club">
      <a class="banner-link" href="https://bancaaguiaoficial.com.br/" target="_blank" rel="noopener noreferrer" aria-label="Acessar"></a>
      <button type="button" class="banner-close" id="bannerClose" aria-label="Fechar">×</button>
    </div>
  </div>

  <!-- Box WhatsApp -->
  <div class="whatsapp-box" id="whatsappBox" onclick="abrirWhatsApp(event)">
    <button type="button" class="close-button" onclick="fecharInformativo(event)" aria-label="Fechar">×</button>
    <div class="whatsapp-title">Grupo Oficial</div>
    <p class="whatsapp-text">Entre no nosso grupo do WhatsApp e fique por dentro das novidades.</p>
    <div class="whatsapp-button">Entrar no grupo</div>
  </div>

  <script>
    // Fechar banner
    document.getElementById("bannerClose").addEventListener("click", function(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById("bannerOverlay").style.display = "none";
    });

    // WhatsApp
    const whatsappLink = "https://chat.whatsapp.com/CaY60otbPRkEJL0n5Hhnvm";

    function abrirWhatsApp(e) {
      if (e.target.closest(".close-button")) return;
      window.location.href = whatsappLink;
    }

    function fecharInformativo(e) {
      e.stopPropagation();
      document.getElementById("whatsappBox").style.display = "none";
    }
  </script>

</body>
</html>
